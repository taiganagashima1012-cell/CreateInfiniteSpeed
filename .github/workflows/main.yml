name: Build Create Infinite Speed

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Java 17を設定
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradleを設定
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: MODをビルド
        run: gradle build --no-daemon

      - name: JARを保存
        uses: actions/upload-artifact@v4
        with:
          name: CreateInfiniteSpeed
          path: build/libs/*.jar
          if-no-files-found: error
